<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo call booking</title><style>
*{box-sizing:border-box}body{margin:0;padding:30px;background:#fff8ec;color:#13233a;font:16px system-ui}h1{font-size:32px;letter-spacing:-1px;margin:12px 0}p{line-height:1.5}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;max-width:420px;margin-top:24px}.calendar button{border:0;background:#ffe7a5;color:#13233a;padding:14px 0;font:inherit;border-radius:50%;cursor:pointer}.calendar button:hover,.calendar button[aria-pressed=true]{background:#ffd23f}.calendar button:focus-visible{outline:3px solid #2f7fd8}.calendar button:disabled{background:transparent;color:#777}.week{display:grid;grid-template-columns:repeat(7,1fr);max-width:420px;font-size:12px;text-align:center;margin-top:25px}.status{padding:16px;background:#fff1d9;max-width:420px;margin-top:24px;border-radius:12px}small{display:block;margin-top:25px}
</style></head><body><p>Alex Morgan · 30 minutes</p><h1>A quick hello.</h1><p>Pick a day to preview the booking interaction.</p><b>November 2026</b><div class="week"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div class="calendar" id="days"></div><p class="status" id="status" aria-live="polite">Choose a day to see an example time.</p><small>Design preview only. No booking will be sent.</small><script>
const days=document.querySelector('#days');for(let day=1;day<=30;day++){const button=document.createElement('button');button.textContent=day;button.type='button';button.disabled=day%7===0||day%7===1;button.setAttribute('aria-label',`November ${day}, 2026`);button.setAttribute('aria-pressed','false');button.addEventListener('click',()=>{days.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelector('#status').textContent=`November ${day} · 10:00–10:30 AM. Example time selected.`;});days.append(button);}
</script></body></html>
